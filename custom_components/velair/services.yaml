update_block_preset:
  name: Update Velair preset
  description: Persistently update an existing shared preset and reconcile its schedules. Omitted values are preserved in update mode.
  fields:
    preset_key:
      name: Velair preset identifier
      description: Stable identifier copied from the preset editor. Changes affect all references.
      required: true
      selector:
        text:
    temperature:
      name: Target temperature
      description: Single target in the Velair temperature unit. Omit to preserve it.
      selector:
        number:
          mode: box
    temperature_range:
      name: Temperature range
      collapsed: true
      fields:
        target_temp_low:
          name: Lower target temperature
          description: Send both range limits. A range replaces the single target.
          selector:
            number:
              mode: box
        target_temp_high:
          name: Upper target temperature
          description: Send both range limits. A range replaces the single target.
          selector:
            number:
              mode: box
    climate_settings:
      name: Mode and additional settings
      collapsed: true
      fields:
        temperature_only:
          name: Temperature only
          description: Update targets without requesting an HVAC mode change or turn-on. Requires a temperature action without device options. Use clear_fields or replace to remove an existing HVAC mode or options.
          selector:
            boolean:
        hvac_mode:
          name: HVAC mode
          description: Omit to preserve the mode. For an Off-only action, use replace with action turn_off.
          selector:
            select:
              options: ["off", heat, cool, heat_cool, auto, dry, fan_only]
        fan_mode:
          name: Fan mode
          selector:
            text:
        preset_mode:
          name: Device preset
          description: Device preset mode, distinct from the shared Velair preset.
          selector:
            text:
        swing_mode:
          name: Swing mode
          selector:
            text:
        swing_horizontal_mode:
          name: Horizontal swing mode
          selector:
            text:
        humidity:
          name: Target humidity
          selector:
            number:
              min: 0
              max: 100
              mode: box
    advanced:
      name: Advanced
      collapsed: true
      fields:
        operation:
          name: Operation
          description: update preserves omitted fields and action. replace removes omitted fields and requires action.
          default: update
          selector:
            select:
              translation_key: preset_update_operation
              options:
                - value: update
                  label: Update fields
                - value: replace
                  label: Replace configuration
        action:
          name: Replacement action
          description: Only for replace. Select the complete resulting action.
          selector:
            select:
              translation_key: preset_update_action
              options:
                - value: set_temperature
                  label: Temperature and settings
                - value: set_hvac_mode
                  label: Mode only
                - value: set_climate_options
                  label: Additional settings only
                - value: turn_off
                  label: Turn off
        clear_fields:
          name: Remove settings
          description: Only for update. Remove settings without resetting the device. The result must remain valid.
          selector:
            select:
              multiple: true
              options: [temperature, target_temp_low, target_temp_high, temperature_only, hvac_mode, fan_mode, preset_mode, swing_mode, swing_horizontal_mode, humidity]

set_temperature:
  name: Set temperature
  description: Set a single target or a lower and upper target range for one climate entity through Home Assistant.
  fields:
    entity_id:
      required: true
      example: climate.living_room
      selector:
        entity:
          domain: climate
    temperature:
      name: Target temperature
      description: Single target temperature. Leave empty when using a lower and upper target range.
      required: false
      example: 21
      selector:
        number:
          mode: box
    target_temp_low:
      name: Lower target temperature
      description: Lower target for a temperature range. Use together with the upper target and leave the single target empty.
      required: false
      example: 20
      selector:
        number:
          mode: box
    target_temp_high:
      name: Upper target temperature
      description: Upper target for a temperature range. Use together with the lower target and leave the single target empty.
      required: false
      example: 24
      selector:
        number:
          mode: box
    hvac_mode:
      name: HVAC mode
      description: Optional mode to apply before setting the temperature. If omitted, the current mode is kept when the climate entity is already on.
      required: false
      example: heat
      selector:
        select:
          options:
            - heat
            - cool
            - heat_cool
            - auto
            - dry
            - fan_only
    fan_mode:
      name: Fan mode
      description: Optional fan mode to apply when the climate entity supports it.
      required: false
      example: low
      selector:
        text:
    preset_mode:
      name: Preset mode
      description: Optional preset to apply when the climate entity supports it.
      required: false
      example: sleep
      selector:
        text:
    swing_mode:
      name: Swing mode
      description: Optional swing mode to apply when the climate entity supports it.
      required: false
      example: vertical
      selector:
        text:
    swing_horizontal_mode:
      name: Horizontal swing mode
      description: Optional horizontal swing mode to apply when the climate entity supports it.
      required: false
      example: auto
      selector:
        text:
    humidity:
      name: Target humidity
      description: Optional target humidity to apply when the climate entity supports it.
      required: false
      example: 50
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"

set_hvac_mode:
  name: Set HVAC mode
  description: Set a non-off HVAC mode for one locally controlled Velair climate without sending a target temperature.
  fields:
    entity_id:
      required: true
      example: climate.living_room
      selector:
        entity:
          domain: climate
    hvac_mode:
      name: HVAC mode
      description: Non-off mode advertised by the selected climate entity.
      required: true
      example: auto
      selector:
        select:
          options:
            - heat
            - cool
            - heat_cool
            - auto
            - dry
            - fan_only

apply_schedule:
  name: Apply schedule
  description: Apply the currently active schedule block now.
  fields:
    entity_id:
      required: false
      example: climate.living_room
      selector:
        entity:
          domain: climate
    hvac_mode:
      name: HVAC mode
      description: Optional mode override used while applying the current schedule.
      required: false
      example: heat
      selector:
        select:
          options:
            - heat
            - cool
            - heat_cool
            - auto
            - dry
            - fan_only

activate_profile:
  name: Activate climate profile
  description: Set one saved climate profile as the complete base and clear all zone exceptions. Zones not covered by it use their default schedules. Leave the profile ID empty to return every zone to Default.
  fields:
    profile_id:
      name: Profile ID
      description: Stable key of the profile to activate. Empty clears the active set and selects Default.
      required: false
      example: away
      selector:
        text:

deactivate_profile:
  name: Deactivate climate profile
  description: Return every zone to Default by clearing the base profiles and all zone exceptions.

activate_profiles:
  name: Activate climate profiles as base
  description: Replace the complete base with non-overlapping profiles and clear all zone exceptions. An empty list selects Default. Profile selection does not guarantee simultaneous physical delivery.
  fields:
    profile_ids:
      name: Profile IDs
      description: Ordered list of stable Profile IDs. Profiles must not include the same zone.
      required: true
      example: [winter_office, winter_bedrooms]
      selector:
        object:

apply_profiles:
  name: Apply climate profiles as exceptions
  description: Replace exceptions only in the zones explicitly included by these profiles. Other zones keep their selection. Overlapping profiles in this request reject the whole action; an empty list does nothing. Cancels a pending Return home.
  fields:
    profile_ids:
      name: Profile IDs
      description: List of stable Profile IDs whose explicit zones should use these profiles as exceptions.
      required: true
      example: [office_remote, guest_rooms]
      selector:
        object:

set_zone_profile:
  name: Set zone profile exception
  description: Apply only one zone from a saved profile, preserving every other zone selection. The profile must include this zone. Use YAML null for Default; use Clear profile exceptions to inherit the base. Cancels a pending Return home.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: climate
    profile_id:
      name: Profile ID
      description: Stable Profile ID, or YAML null to explicitly use the zone's Default schedule.
      required: true
      example: office_remote
      selector:
        object:

clear_profile_overrides:
  name: Clear profile exceptions
  description: Restore the current base for the explicitly selected zones. Previous exceptions are not restored. An empty list does nothing. Cancels a pending Return home when zones are requested.
  fields:
    entity_id:
      name: Climate entities
      description: One managed climate entity or a list. All targets must be valid before any exception is removed.
      required: true
      selector:
        entity:
          domain: climate
          multiple: true

boost:
  name: Boost
  description: Temporarily override one zone with a single target or target range, then return that zone to its active schedule.
  fields:
    entity_id:
      required: true
      example: climate.living_room
      selector:
        entity:
          domain: climate
    temperature:
      name: Target temperature
      description: Single boost target. Leave empty when using a lower and upper target range.
      required: false
      example: 22
      selector:
        number:
          mode: box
    target_temp_low:
      name: Lower target temperature
      description: Lower boost target for a temperature range. Use together with the upper target and leave the single target empty.
      required: false
      example: 20
      selector:
        number:
          mode: box
    target_temp_high:
      name: Upper target temperature
      description: Upper boost target for a temperature range. Use together with the lower target and leave the single target empty.
      required: false
      example: 24
      selector:
        number:
          mode: box
    duration_minutes:
      required: true
      example: 45
      selector:
        number:
          min: 1
          max: 10080
          step: 5
          unit_of_measurement: min
    hvac_mode:
      name: HVAC mode
      description: Optional mode to apply before boost. If omitted, the current mode is kept when the climate entity is already on.
      required: false
      example: heat
      selector:
        select:
          options:
            - heat
            - cool
            - heat_cool
            - auto
            - dry
            - fan_only
    fan_mode:
      name: Fan mode
      description: Optional fan mode to apply for the boost when supported.
      required: false
      example: high
      selector:
        text:
    preset_mode:
      name: Preset mode
      description: Optional preset to apply for the boost when supported.
      required: false
      example: boost
      selector:
        text:
    swing_mode:
      name: Swing mode
      description: Optional swing mode to apply for the boost when supported.
      required: false
      example: vertical
      selector:
        text:
    swing_horizontal_mode:
      name: Horizontal swing mode
      description: Optional horizontal swing mode to apply for the boost when supported.
      required: false
      example: auto
      selector:
        text:
    humidity:
      name: Target humidity
      description: Optional target humidity to apply for the boost when supported.
      required: false
      example: 50
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"

cancel_boost:
  name: Cancel boost
  description: Cancel one active boost and immediately return the climate to its current explicit schedule target or its state before the boost.
  fields:
    entity_id:
      required: true
      example: climate.living_room
      selector:
        entity:
          domain: climate

pause:
  name: Pause
  description: Temporarily pause automatic schedule execution.
  fields:
    duration_minutes:
      required: false
      example: 60
      selector:
        number:
          min: 1
          max: 10080
          step: 5
          unit_of_measurement: min

resume:
  name: Resume
  description: Resume automatic schedule execution and apply the current schedule.
  fields: {}

pause_zone:
  name: Pause zone
  description: Add or update a reason that pauses automatic schedule execution for one managed climate entity. The climate can optionally be turned off while any reason remains.
  fields:
    until_next_block:
      name: Until next block
      description: End this pause at the next scheduled block start. Expiry is fixed when requested and does not follow later schedule edits. Cannot be combined with duration_minutes. Fails if no future block exists; other pause reasons remain active.
      required: false
      default: false
      selector:
        boolean:
    entity_id:
      required: true
      example: climate.guest_room
      selector:
        entity:
          domain: climate
    duration_minutes:
      required: false
      example: 120
      selector:
        number:
          min: 1
          max: 10080
          step: 5
          unit_of_measurement: min
    action:
      name: Pause action
      description: Optional action to apply immediately when the zone is paused.
      required: false
      default: none
      example: turn_off
      selector:
        select:
          options:
            - none
            - turn_off
    pause_id:
      name: Pause ID
      description: Optional stable reason identifier for an automation. Reusing it updates only that reason; omitting it replaces all reasons with one manual pause.
      required: false
      example: velair_window_guard
      selector:
        text:

resume_zone:
  name: Resume zone
  description: Remove one identified pause reason, or remove all reasons when pause_id is omitted for legacy compatibility.
  fields:
    entity_id:
      required: true
      example: climate.guest_room
      selector:
        entity:
          domain: climate
    apply_current_schedule:
      name: Apply current schedule
      description: Apply the currently active schedule block for this climate after resuming, when one exists.
      required: false
      default: true
      example: true
      selector:
        boolean:
    pause_id:
      name: Pause ID
      description: Optional stable reason identifier. When provided, only that reason is removed.
      required: false
      example: velair_window_guard
      selector:
        text:
    resume_all:
      name: Resume all
      description: Explicitly remove every pause reason. Cannot be combined with Pause ID; omitting both retains legacy resume-all behavior.
      required: false
      example: true
      selector:
        boolean:

set_daily_schedule:
  name: Set daily schedule
  description: Replace one weekday schedule for one managed climate entity.
  fields:
    entity_id:
      required: true
      example: climate.living_room
      selector:
        entity:
          domain: climate
    weekday:
      required: true
      example: monday
      selector:
        select:
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    blocks:
      required: false
      description: Provide exactly one of blocks or template_link. Blocks use start and preset_key for a linked Velair preset, or inline settings. Temperature blocks need a target; temperature_only true preserves HVAC mode including off and cannot include mode or device options. Mode-only blocks need action set_hvac_mode and a non-off hvac_mode. Turn-off blocks need start and action turn_off.
      example:
        - start: "06:00"
          action: set_temperature
          temperature: 21
          hvac_mode: heat
        - start: "09:00"
          action: turn_off
        - start: "12:00"
          action: set_hvac_mode
          hvac_mode: auto
        - start: "15:00"
          action: set_temperature
          temperature: 18
        - start: "18:00"
          action: set_temperature
          temperature: 24
          hvac_mode: cool
          fan_mode: low
          preset_mode: sleep
          swing_mode: "off"
      selector:
        object:
    template_link:
      description: Link this day to a template. Use mode hours with template_key and bindings keyed by slot_id, or mode full with template_key and no bindings. Omitted mode means hours. Use instead of blocks.
      selector:
        object:
    unlink_template:
      description: Explicitly replace a template link with independent blocks.
      selector:
        boolean:
    expected_revision:
      description: Configuration revision returned by Velair, required when changing shared references.
      selector:
        number:
          min: 0
          mode: box

copy_day_schedule:
  name: Clone day schedule
  description: Clone a saved weekday to target days and managed climates, preserving template links and Velair preset references.
  fields:
    target_entity_ids:
      name: Target climates
      description: Omit to clone within the source climate. All destinations are validated and saved together.
      selector:
        entity:
          domain: climate
          multiple: true
    expected_revision:
      name: Configuration revision
      description: Optional optimistic concurrency check. Omit to clone the latest saved source under the configuration lock.
      selector:
        number:
          min: 0
          mode: box
    entity_id:
      name: Source climate
      description: Managed climate whose saved day will be cloned.
      required: true
      example: climate.living_room
      selector:
        entity:
          domain: climate
    source_weekday:
      name: Source weekday
      description: Saved day to clone, including its template link and preset references.
      required: true
      example: monday
      selector:
        select:
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    target_weekdays:
      name: Target weekdays
      description: Replace these saved days in every selected target climate. Other days are unchanged.
      required: true
      example:
        - tuesday
        - wednesday
        - thursday
      selector:
        select:
          multiple: true
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday

clear_schedule:
  name: Clear schedule
  description: Clear one weekday schedule, or all weekdays if weekday is omitted, for one managed climate entity.
  fields:
    entity_id:
      required: true
      example: climate.living_room
      selector:
        entity:
          domain: climate
    weekday:
      required: false
      example: sunday
      selector:
        select:
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday

enable_room_sensor_assist:
  name: Enable Room Sensor Assist
  description: Enable Room Sensor Assist for one managed climate entity that already has a room temperature sensor configured.
  fields:
    entity_id:
      required: true
      example: climate.living_room
      selector:
        entity:
          domain: climate

disable_room_sensor_assist:
  name: Disable Room Sensor Assist
  description: Disable Room Sensor Assist for one managed climate entity and restore its current scheduled target when needed.
  fields:
    entity_id:
      required: true
      example: climate.living_room
      selector:
        entity:
          domain: climate

set_external_change_policy:
  name: Set external change policy
  description: Choose whether Velair reapplies its current authority or starts Manual control when a managed climate changes outside Velair.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: climate
    policy:
      required: true
      selector:
        select:
          options:
            - keep_automatic
            - until_next_block
            - for_duration
            - until_resumed
    duration_minutes:
      required: false
      example: 60
      selector:
        number:
          min: 1
          max: 10080
          step: 5
          unit_of_measurement: min

resume_automatic_control:
  name: Resume automatic control
  description: Leave Manual adjustment, resolve the current Velair intent, and deliver it only when scheduler state and other overrides allow.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: climate

start_planned_return:
  name: I'm leaving
  description: Plan a one-off return for a future date and time. With saved occupancy sources, Velair waits for confirmed household absence unless Apply Away mode now is enabled. Without sources, explicit start activates Away immediately. Works with the weekly routine disabled; requires saved setups and Automatic scheduling. Updates the arrival time if an absence is already active.
  fields:
    return_date:
      name: Return date
      description: Arrival date in Home Assistant's time zone. The date and time together must be in the future.
      required: true
      example: "2026-10-09"
      selector:
        date:
    return_time:
      name: Return time
      description: Arrival time on the selected date in Home Assistant's time zone. Use HH:MM in YAML; optional seconds must be 00. Nonexistent times during daylight saving changes are rejected.
      required: true
      example: "19:25"
      selector:
        time:

    apply_away_now:
      name: Apply Away mode now
      description: Apply the configured Away mode immediately. With occupancy sources, automatic presence return is enabled only after continuous absence for the configured confirmation delay. Scheduled preparation and arrival remain active.
      default: false
      selector:
        boolean:

cancel_planned_return:
  name: Cancel planned return
  description: Cancel a planned return or close an ended return notice. After Away was applied, including immediate manual Away before monitored departure confirmation, restores the Mode and Profiles selected before the episode started. A normal pending departure leaves selection unchanged. Removes return preparation and prevents automatic rearming while away. An explicit new return can replace the ended episode.
  fields: {}

enter_manual_adjustment:
  name: Enter Manual adjustment
  description: Enter Manual adjustment with the climate's live HVAC mode and setpoint. It uses the saved external-adjustment policy; when Keep automatic is saved, the explicit hold lasts until automatic control is resumed.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: climate
