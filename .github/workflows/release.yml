name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-release:
    name: Package release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run backend tests
        run: python -m unittest discover -s tests

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test

      - name: Check TypeScript
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build release frontend bundle
        working-directory: frontend
        run: npm run build:release

      - name: Read release version
        id: version
        run: |
          VERSION="$(node -p "require('./custom_components/velair/manifest.json').version")"
          case "$VERSION" in
            *-*) PRERELEASE="true" ;;
            *) PRERELEASE="false" ;;
          esac
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'prerelease=%s\n' "$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Validate versioned release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          RELEASE_NOTES=".github/release-notes/v${RELEASE_VERSION}.md"
          if [ ! -f "$RELEASE_NOTES" ]; then
            echo "Missing release notes for version ${RELEASE_VERSION}: $RELEASE_NOTES"
            exit 1
          fi

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          EXPECTED_TAG="v${RELEASE_VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag $RELEASE_TAG does not match manifest version $EXPECTED_TAG"
            exit 1
          fi

      - name: Package release assets
        run: python .github/scripts/package_release.py

      - name: Upload packaged release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velair-release-${{ steps.version.outputs.version }}
          path: .release/artifacts/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_NOTES=".github/release-notes/v${RELEASE_VERSION}.md"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            CREATE_ARGS=(
              "$RELEASE_TAG"
              --title "Velair ${RELEASE_VERSION}"
              --notes-file "$RELEASE_NOTES"
            )
            if [ "$RELEASE_PRERELEASE" = "true" ]; then
              CREATE_ARGS+=(--prerelease)
            fi
            gh release create "${CREATE_ARGS[@]}"
          fi
          gh release upload "$RELEASE_TAG" .release/artifacts/*.zip --clobber
