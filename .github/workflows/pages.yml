name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
      - "scripts/quality/site.py"
      - "scripts/quality/report.py"
      - "scripts/quality/actions.py"
      - "scripts/quality/actions.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up quality report generator
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Generate public quality pages from published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/quality/site.py --output website/public/quality --repository "$GITHUB_REPOSITORY"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
